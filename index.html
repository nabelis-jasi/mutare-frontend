<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutare Sewer Engineering Dashboard</title>
    <link rel="icon" href="data:,">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Heatmap Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- jsPDF for reports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.0/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Main Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">
    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div id="layermanager-container"></div>
        <div id="filters-container">
            <div class="filter-section">
                <button id="mainFilterBtn" class="filter-main-btn">🔍 FILTERS</button>
                <div class="active-filters-summary" id="activeFiltersSummary"></div>
            </div>
        </div>
        <div id="reportprocessor-container"></div>
    </div>
    
    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div id="toolbar-container"></div>
        
        <div id="map-container" class="map-container">
            <div id="map"></div>
        </div>
        
        <div id="status-container"></div>
    </div>
    
    <!-- RIGHT PANEL - Heatmap moved to between hotspots and reports -->
    <div class="right-panel">
        <div id="statistics-container"></div>
        <div id="hotspots-container"></div>
        
        <!-- HEATMAP - MOVED HERE (between hotspots and reports) -->
        <div id="heatmap-container"></div>
        
        <div id="identification-container"></div>
        <div id="reports-container"></div>
    </div>
</div>

<!-- Main Application Script -->
<script type="module" src="main.js"></script>

</body>
</html>
